<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background: #4f46e5;
            color: white;

            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #4338ca;
        }

        #btnCadastro {
            background: #16a34a;
        }

        #btnCadastro:hover {
            background: #15803d;
        }

        #btnLogout {
            background: #dc2626;
        }

        #btnLogout:hover {
            background: #b91c1c;
        }

        #login {
            display: block;
        }

        #usuarioLogado {
            display: none;
            text-align: center;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- LOGIN -->
        <div id="login">
            <h1>Login</h1>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="senha" placeholder="Senha">
            <button id="btnLogin">
                Entrar
            </button>
            <button id="btnCadastro">
                Criar conta
            </button>
            <div id="mensagem"></div>
        </div>

        <!-- USUÁRIO LOGADO -->
        <div id="usuarioLogado">
            <nav class="navbar">
                <a href="/julia/larpets/cliente/cliente.html">Clientes</a>
                <a href="*">Veterinário</a>
            </nav>

            <h1>Bem-vindo!</h1>
            <p id="emailUsuario"></p>
            <br>
            <button id="btnLogout">
                Sair
            </button>
        </div>
    </div>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- BANCO DE DADOS JS -->
    <script src="conexao_banco.js"></script>
</body>

</html>
